<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bounty Radar — Bob skill proof</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px}
input,button{font-size:15px;padding:8px}button{cursor:pointer}
.card{border:1px solid #ddd;border-radius:8px;padding:10px;margin:10px 0}
.muted{color:#666;font-size:13px}
</style>
</head>
<body>
<h2>📡 Bounty Radar — Bob skill proof (IBM Bob 2.0)</h2>
<p class="muted">Nhập skills + min-reward, nhận shortlist Superteam Earn có điểm. Repo: github.com/crytobot459/bob-bounty-radar</p>
<label>skills (phẩy): <input id="skills" value="solana,dev,agent" size="30"></label>
<label>min-reward USD: <input id="minr" type="number" value="300" style="width:100px"></label>
<button onclick="run()">Rank</button>
<div id="out" class="muted">Bấm Rank…</div>
<script>
const API="https://earn.superteam.fun/api/listings";
function daysLeft(dl){try{return (new Date(dl)-Date.now())/86400000}catch(e){return null}}
function scoreRows(items,skills,minR){
  const rows=[];
  for(const x of items){
    if((x.status||"")!=="OPEN"||x.isWinnersAnnounced)continue;
    let raw=x.rewardAmount;
    if(raw==null||(typeof raw==="string"&&!raw.trim()))continue;
    const reward=parseFloat(raw);if(isNaN(reward)||reward<minR)continue;
    const dl=daysLeft(x.deadline||"");if(dl==null||dl<=0)continue;
    const title=x.title||"";
    const hits=skills.filter(k=>title.toLowerCase().includes(k));
    const subs=(x._count||{}).Submission;
    const score=(reward>=1000?15:reward>=300?10:6)+(dl>7?10:dl>3?6:3)
      +Math.min(30,hits.length*10)
      +(subs!=null?(subs<=5?5:subs<=15?3:1):3);
    rows.push({score,reward,dl,title,subs,slug:x.slug||"",hits});
  }
  rows.sort((a,b)=>b.score-a.score);return rows;
}
async function run(){
  const skills=document.getElementById("skills").value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
  const minR=parseFloat(document.getElementById("minr").value||"0");
  const out=document.getElementById("out");out.textContent="Đang fetch Superteam Earn…";
  try{
    const r=await fetch(API);const items=await r.json();
    const rows=scoreRows(items,skills,minR);
    if(!rows.length){out.textContent=`scanned=${items.length} — không có bounty khớp, giảm min-reward.`;return;}
    out.innerHTML=`<p>scanned=${items.length} board=superteam-earn live</p>`+rows.slice(0,10).map((w,i)=>
      `<div class="card"><b>${i+1}. [${w.score}] ${w.title.slice(0,80)}</b><br>$${w.reward} | ${w.dl.toFixed(0)}d left | ${w.subs} subs | match: ${w.hits.join(",")||"-"}<br><a href="https://earn.superteam.fun/listing/${w.slug}" target="_blank">mở listing</a></div>`).join("");
  }catch(e){out.textContent="Lỗi mạng board: "+String(e).slice(0,200)}
}
run();
</script>
</body>
</html>
